<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="32" height="32" color="#e8e4da" fill="currentColor" role="img" aria-labelledby="title description">
  <title id="title">Келзериас — малый, редакция 2, светлые линии</title>
  <desc id="description">Ручная векторная адаптация выбранного оригинала: вытянутая маска, изогнутые рога, гребень и нижнее острие, многослойные крылья-лезвия, кольцо и четыре полых ромба. Двойное кольцо и дополнительные прорези для пробы в 24–48 пикселях. Прозрачный фон. Форма и читаемость пока не приняты.</desc>
