<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="16" height="16" color="#e8e4da" fill="currentColor" role="img" aria-labelledby="title description">
  <title id="title">Келзериас — микро, редакция 2, светлые линии</title>
  <desc id="description">Ручная векторная адаптация выбранного оригинала: вытянутая маска, изогнутые рога, гребень и нижнее острие, многослойные крылья-лезвия, кольцо и четыре полых ромба. Утолщённые линии и увеличенные просветы для пробы в 16 пикселях. Прозрачный фон. Форма и читаемость пока не приняты.</desc>
