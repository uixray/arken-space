<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="theme-color" content="#132a35" />
    <title>Магическая диспетчерская Миши</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="../">← Страница Миши</a>
      <div>
        <span>Смена <strong data-shift>1/5</strong></span
        ><span>Репутация <strong data-reputation>5</strong></span
        ><span>Город <strong data-city>10</strong></span>
      </div>
      <button type="button" data-reset>Новая смена</button>
    </header>
    <main class="shell">
      <section class="map" aria-label="Карта Тристонии">
        <div class="map__rings" aria-hidden="true"></div>
        <p class="map__label">Тристония · диспетчерский сектор</p>
        <div class="map__markers" data-markers></div>
        <div class="signal" data-signal>
          <span>Входящий вызов</span><strong data-signal-title></strong>
        </div>
      </section>
      <aside class="brief" data-brief aria-live="polite"></aside>
      <section class="roster" aria-labelledby="roster-title">
        <div class="section-title">
          <div>
            <span>Доступные специалисты</span>
            <h1 id="roster-title">Команда магов</h1>
          </div>
          <p>
            Выберите до двух магов. Состав влияет на доступные решения и
            последствия.
          </p>
        </div>
        <div class="mage-list" data-mage-list></div>
      </section>
    </main>
    <script type="module" src="./ui.js"></script>
  </body>
</html>
