<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="theme-color" content="#132a35" />
    <title>Магическая диспетчерская Миши</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="player" href="../"><img src="./assets/leonard.webp" alt="" /><span>Леонард<small>Игрок · диспетчер</small></span></a>
      <div class="topbar__stats">
        <span data-mode-label>Глава I <strong data-shift>1/5</strong></span
        ><span>Репутация <strong data-reputation>5</strong></span
        ><span>Город <strong data-city>10</strong></span>
      </div>
      <div class="topbar__actions"><button type="button" data-mode>Аркада</button><button type="button" data-reset>Новая игра</button></div>
    </header>
    <main class="shell">
      <section class="map" data-mobile-panel="map" aria-label="Карта Тристонии">
        <div class="map__rings" aria-hidden="true"></div>
        <p class="map__label">Велтория · диспетчерский сектор</p>
        <div class="map__markers" data-markers></div>
        <div class="map__heroes" data-hero-tokens aria-label="Герои на маршруте"></div>
        <div class="radio-line" data-radio-line aria-live="polite" hidden></div>
        <div class="signal" data-signal>
          <span>Входящий вызов</span><strong data-signal-title></strong>
        </div>
      </section>
      <aside class="brief" data-brief data-mobile-panel="brief" aria-live="polite"></aside>
      <section class="roster" data-mobile-panel="team" aria-labelledby="roster-title">
        <div class="section-title">
          <div>
            <span>Доступные специалисты</span>
            <h1 id="roster-title">Команда магов</h1>
          </div>
          <p data-team-note>
            Выберите до двух магов. Состав влияет на доступные решения и
            последствия.
          </p>
        </div>
        <div class="mage-list" data-mage-list></div>
      </section>
    </main>
    <nav class="mobile-nav" aria-label="Разделы диспетчерской">
      <button type="button" data-mobile-view="map"><span>01</span>Карта</button>
      <button type="button" data-mobile-view="team"><span data-team-count>0/2</span>Команда</button>
      <button type="button" data-mobile-view="brief"><span>03</span>Решение</button>
    </nav>
    <script type="module" src="./ui.js"></script>
  </body>
</html>
