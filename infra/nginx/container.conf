map $request_uri $arken_web_uri_loggable {
  default 1;
  # Match the original target, not only Nginx's normalized URI. This catches
  # dot-segment and escaped-delimiter requests that leave the protected
  # location before access logging.
  "~*^(?:/|%2f)+(?:gm|join)(?:/|%2f|$|[?]|%|;)" 0;
  "~*^(?:/|%2f)+(?:g|%67)(?:m|%6d)(?:/|%2f|$|[?]|%|;)" 0;
  "~*^(?:/|%2f)+(?:j|%6a)(?:o|%6f)(?:i|%69)(?:n|%6e)(?:/|%2f|$|[?]|%|;)" 0;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Referrer-Policy no-referrer always;
  access_log /var/log/nginx/access.log main if=$arken_web_uri_loggable;

  # `$request_uri` is the original raw target. Rewrite sensitive requests into
  # a private internal location before normalized URI matching can route them
  # into a URI-bearing error logger. The browser keeps its original address.
  if ($arken_web_uri_loggable = 0) {
    rewrite ^ /__arken_sensitive_index last;
  }

  location = /__arken_sensitive_index {
    internal;
    access_log off;
    error_log /dev/null emerg;
    add_header Referrer-Policy no-referrer always;
    try_files /index.html =404;
  }

  # Legacy campaign URLs carry a bearer in the path. Do not log their request
  # target (including malformed subpaths); ordinary static requests keep the
  # default access/error logs.
  location ~* ^/(?:gm|join)(?:/|$) {
    access_log off;
    error_log /dev/null emerg;
    add_header Referrer-Policy no-referrer always;
    # Serve the SPA entry as a file without changing URI/location; an internal
    # redirect would reselect `/` and restore URI-bearing error-log behavior.
    try_files /index.html =404;
  }

  # Stock nginx MIME tables omit WAV; preserve the explicit audio contract.
  location ~* \.wav$ {
    types { audio/wav wav; }
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
