# The legacy host keeps old campaign URLs working through the HTTPS migration.
# Filter from the original raw request target so path normalization cannot
# re-enable a URI-bearing access log.
map $request_uri $arken_legacy_uri_loggable {
  default 1;
  "~*^(?:/|%2f)+(?:gm|join)(?:/|%2f|$|[?]|%|;)" 0;
  "~*^(?:/|%2f)+(?:g|%67)(?:m|%6d)(?:/|%2f|$|[?]|%|;)" 0;
  "~*^(?:/|%2f)+(?:j|%6a)(?:o|%6f)(?:i|%69)(?:n|%6e)(?:/|%2f|$|[?]|%|;)" 0;
}

# Legacy domain. The application now lives on arken-khar.space; this host
# only redirects. Keep the cert renewed as long as this file exists.
server {
  listen 80;
  server_name arken.uixray.tech;
  add_header Referrer-Policy no-referrer always;
  access_log /var/log/nginx/access.log main if=$arken_legacy_uri_loggable;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location ~* ^/(?:gm|join)(?:/|$) {
    access_log off;
    error_log /dev/null emerg;
    add_header Referrer-Policy no-referrer always;
    return 301 https://arken-khar.space$request_uri;
  }

  location / {
    return 301 https://arken-khar.space$request_uri;
  }
}

server {
  listen 127.0.0.1:4430 ssl;
  server_name arken.uixray.tech;

  ssl_certificate /etc/letsencrypt/live/arken.uixray.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/arken.uixray.tech/privkey.pem;
  add_header Referrer-Policy no-referrer always;
  access_log /var/log/nginx/access.log main if=$arken_legacy_uri_loggable;

  location ~* ^/(?:gm|join)(?:/|$) {
    access_log off;
    error_log /dev/null emerg;
    add_header Referrer-Policy no-referrer always;
    return 301 https://arken-khar.space$request_uri;
  }

  location / {
    return 301 https://arken-khar.space$request_uri;
  }
}
