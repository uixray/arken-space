# Legacy domain. The application now lives on arken-khar.space; this host
# only redirects. Keep the cert renewed as long as this file exists.
server {
  listen 80;
  server_name arken.uixray.tech;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://arken-khar.space$request_uri;
  }
}

server {
  listen 127.0.0.1:4430 ssl;
  server_name arken.uixray.tech;

  ssl_certificate /etc/letsencrypt/live/arken.uixray.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/arken.uixray.tech/privkey.pem;

  location / {
    return 301 https://arken-khar.space$request_uri;
  }
}
