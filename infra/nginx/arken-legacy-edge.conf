# Docker gateway overlay, not the native 127.0.0.1:4430 installation template.
# Append HTTP first for manual HTTP-01; append HTTPS only after cert issuance.
# Keep the existing gateway prefix/inode and validate nginx before each reload.
# This retired host has no application endpoints or URI-bearing request logs.

# BEGIN LEGACY HTTP
server {
  listen 80;
  server_name arken.uixray.tech;
  access_log off;
  error_log /dev/null emerg;
  add_header Referrer-Policy no-referrer always;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://arken-khar.space$request_uri;
  }
}
# END LEGACY HTTP

# BEGIN LEGACY HTTPS
server {
  listen 443 ssl;
  server_name arken.uixray.tech;
  ssl_certificate /etc/letsencrypt/live/arken.uixray.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/arken.uixray.tech/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  access_log off;
  error_log /dev/null emerg;
  add_header Referrer-Policy no-referrer always;

  location / {
    return 301 https://arken-khar.space$request_uri;
  }
}
# END LEGACY HTTPS
