map $http_upgrade $arken_khar_connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name arken-khar.space .arken-khar.space;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# Main application (was arken.uixray.tech)
server {
  listen 127.0.0.1:4430 ssl;
  server_name arken-khar.space;

  ssl_certificate /etc/letsencrypt/live/arken-khar.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/arken-khar.space/privkey.pem;
  client_max_body_size 105m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /socket.io/ {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $arken_khar_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
  }

  location /healthz {
    proxy_pass http://127.0.0.1:4100/healthz;
  }

  location / {
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Static personal and family landing pages, one per subdomain.
server {
  listen 127.0.0.1:4430 ssl;
  server_name
    archinamon.arken-khar.space
    irakly123.arken-khar.space
    daryasteel.arken-khar.space
    veepeek.arken-khar.space
    zheludock.arken-khar.space
    uixray.arken-khar.space
    chepurnykhsv.arken-khar.space
    taisiya.arken-khar.space
    lev.arken-khar.space;

  ssl_certificate /etc/letsencrypt/live/arken-khar.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/arken-khar.space/privkey.pem;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive, noimageindex" always;
  add_header X-Frame-Options DENY always;

  root /var/www/arken-khar-players/$host;
  index index.html;

  location / {
    try_files $uri /index.html;
  }
}
