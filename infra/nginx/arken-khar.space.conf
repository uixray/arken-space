map $http_upgrade $arken_khar_connection_upgrade {
  default upgrade;
  '' close;
}

map $request_uri $arken_khar_uri_loggable {
  default 1;
  "~*^(?:/|%2f)+(?:gm|join)(?:/|%2f|$|[?]|%|;)" 0;
  "~*^(?:/|%2f)+(?:g|%67)(?:m|%6d)(?:/|%2f|$|[?]|%|;)" 0;
  "~*^(?:/|%2f)+(?:j|%6a)(?:o|%6f)(?:i|%69)(?:n|%6e)(?:/|%2f|$|[?]|%|;)" 0;
}

server {
  listen 80;
  server_name arken-khar.space .arken-khar.space;
  access_log /var/log/nginx/access.log main if=$arken_khar_uri_loggable;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location ~* ^/(?:gm|join)(?:/|$) {
    access_log off;
    error_log /dev/null emerg;
    add_header Referrer-Policy no-referrer always;
    return 301 https://$host$request_uri;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# Main application (was arken.uixray.tech)
server {
  listen 127.0.0.1:4430 ssl;
  server_name arken-khar.space;

  ssl_certificate /etc/letsencrypt/live/arken-khar.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/arken-khar.space/privkey.pem;
  client_max_body_size 105m;
  access_log /var/log/nginx/access.log main if=$arken_khar_uri_loggable;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Use the raw target to catch paths normalized out of the bearer locations.
  if ($arken_khar_uri_loggable = 0) {
    rewrite ^ /__arken_sensitive_index? last;
  }

  location = /__arken_sensitive_index {
    internal;
    access_log off;
    error_log /dev/null emerg;
    add_header Referrer-Policy no-referrer always;
    proxy_pass http://127.0.0.1:4180/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $arken_khar_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
  }

  # Preserve legacy direct links while suppressing URI-bearing logs at the
  # first public app edge. The web container repeats the same policy.
  location ~* ^/(?:gm|join)(?:/|$) {
    access_log off;
    error_log /dev/null emerg;
    add_header Referrer-Policy no-referrer always;
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
  }

  location /healthz {
    proxy_pass http://127.0.0.1:4100/healthz;
  }

  location / {
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Static personal and family landing pages, one per subdomain.
server {
  listen 127.0.0.1:4430 ssl;
  server_name
    archinamon.arken-khar.space
    irakly123.arken-khar.space
    daryasteel.arken-khar.space
    veepeek.arken-khar.space
    zheludock.arken-khar.space
    uixray.arken-khar.space
    chepurnykhsv.arken-khar.space
    taisiya.arken-khar.space
    lev.arken-khar.space;

  ssl_certificate /etc/letsencrypt/live/arken-khar.space/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/arken-khar.space/privkey.pem;
  access_log /var/log/nginx/access.log main if=$arken_khar_uri_loggable;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive, noimageindex" always;
  add_header X-Frame-Options DENY always;

  root /var/www/arken-khar-players/$host;
  index index.html;

  if ($arken_khar_uri_loggable = 0) {
    rewrite ^ /__arken_sensitive_index last;
  }

  location = /__arken_sensitive_index {
    internal;
    access_log off;
    error_log /dev/null emerg;
    add_header Referrer-Policy no-referrer always;
    try_files /index.html =404;
  }

  location ~* ^/(?:gm|join)(?:/|$) {
    access_log off;
    error_log /dev/null emerg;
    add_header Referrer-Policy no-referrer always;
    try_files /index.html =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
