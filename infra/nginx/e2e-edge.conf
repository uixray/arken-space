map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $request_uri $arken_edge_uri_loggable {
  default 1;
  "~*^(?:/|%2f)+(?:gm|join)(?:/|%2f|$|[?]|%|;)" 0;
  "~*^(?:/|%2f)+(?:g|%67)(?:m|%6d)(?:/|%2f|$|[?]|%|;)" 0;
  "~*^(?:/|%2f)+(?:j|%6a)(?:o|%6f)(?:i|%69)(?:n|%6e)(?:/|%2f|$|[?]|%|;)" 0;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 105m;
  add_header Referrer-Policy no-referrer always;
  access_log /var/log/nginx/access.log main if=$arken_edge_uri_loggable;

  # Route by the raw request target before normalized location matching. This
  # keeps dot-segment/escaped variants out of both access and error logs.
  if ($arken_edge_uri_loggable = 0) {
    rewrite ^ /__arken_sensitive_index? last;
  }

  location = /__arken_sensitive_index {
    internal;
    access_log off;
    error_log /dev/null emerg;
    add_header Referrer-Policy no-referrer always;
    proxy_pass http://web:80/;
    proxy_set_header Host $host;
  }

  # This test edge proxies the public SPA. Never record bearer-bearing legacy
  # link paths here; preserve ordinary request logs for other routes.
  location ~* ^/(?:gm|join)(?:/|$) {
    access_log off;
    error_log /dev/null emerg;
    add_header Referrer-Policy no-referrer always;
    proxy_pass http://web:80;
    proxy_set_header Host $host;
  }

  location /socket.io/ {
    proxy_pass http://server:4100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
  }

  location /api/ {
    proxy_pass http://server:4100;
    proxy_set_header Host $host;
    proxy_request_buffering off;
  }

  location /healthz {
    proxy_pass http://server:4100/healthz;
  }

  location / {
    proxy_pass http://web:80;
    proxy_set_header Host $host;
  }
}
