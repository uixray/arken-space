name: e2e

# UIX-522: browser-прогон снят с машины владельца.
#
# `checks.yml` намеренно оставил Playwright за бортом («их место в CI —
# отдельное решение, а не довесок к первому же workflow»). Пока его не было,
# принять задачу с UI-изменениями без локального компьютера было нельзя:
# Chromium + Firefox теперь идут отдельными заданиями с независимыми backend.
#
# Мультиплеерный gate (`pnpm test:multiplayer`) сюда по-прежнему не входит: он
# поднимает свой Docker Compose и требует отдельного решения.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Общий последовательный прогон подошёл к 45 минутам. Делим по браузеру,
    # не увеличивая лимит, число Playwright workers или retries.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - project: chromium
            installBrowser: chrome
          - project: firefox
            installBrowser: firefox

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: arken
          POSTGRES_USER: arken
          POSTGRES_PASSWORD: arken
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arken -d arken"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Проект не использует dotenv и не читает `.env` сам: переменные обязаны
      # приходить из окружения, иначе `apps/server/src/env.ts` не соберётся.
      DATABASE_URL: postgres://arken:arken@localhost:5432/arken
      WEB_ORIGIN: http://localhost:5173
      PUBLIC_URL: http://localhost:5173
      MEDIA_ROOT: ./media

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Та же причина, что и в checks.yml: workspace-пакеты экспортируются из
      # `dist`, и без сборки сервер не стартует.
      - run: pnpm build

      # GM-токен генерируется на прогон. Это не про секретность — база здесь
      # одноразовая, — а про то, что seed записывает hash только в пустую базу.
      # Локально именно из-за этого восемь тестов месяцами молча скипались на
      # давно созданном томе, и часть из них успела устареть незамеченной.
      - name: Generate GM access token
        run: echo "GM_ACCESS_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - run: pnpm db:migrate

      # Chromium project в неизменённом config использует channel: "chrome".
      # Устанавливаем только браузер этого задания, без смены channel.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.installBrowser }}

      # Playwright поднимает только web (`webServer` в playwright.config.ts);
      # API-сервер нужно завести самим. Он же применяет seed, то есть создаёт
      # кампанию и записывает hash токена.
      #
      # Запускается собранный `dist`, а не `dev`: watch-режим в CI только
      # мешает, а сборка к этому шагу уже готова.
      - name: Start API server
        run: |
          mkdir -p media
          nohup node apps/server/dist/index.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4100/healthz > /dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 3
          done
          echo "server did not become healthy"
          tail -40 /tmp/server.log
          exit 1

      - run: pnpm test:e2e --project=${{ matrix.project }} --workers=1 --fail-on-flaky-tests

      # Компактные доказательства синтетического acceptance-пула нужны и при
      # успехе. Только PNG и именованные JSON receipts этих пяти spec-файлов;
      # трассы, логи и прочие данные остаются в failure-only артефактах ниже.
      - name: Upload synthetic acceptance receipts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-acceptance-receipts-${{ matrix.project }}
          path: |
            test-results/russian-error-copy-*/*.png
            test-results/russian-error-copy-*/error-copy-receipt.json
            test-results/russian-world-copy-*/*.png
            test-results/russian-world-copy-*/copy-receipts.json
            test-results/token-create-place-outcome-*/*.png
            test-results/token-create-place-outcome-*/token-outcome-receipt.json
            test-results/token-upload-source-select-*/*.png
            test-results/token-upload-source-select-*/upload-source-receipt.json
            test-results/follow-scroll-resize-*/*.png
            test-results/follow-scroll-resize-*/resize-follow-receipts.json
          retention-days: 7
          if-no-files-found: error

      # Retry-success и отмена не должны терять уже записанные modal receipts.
      # Только именованные синтетические JSON/PNG; suffix включает retry-папки.
      # При принудительном завершении runner загрузка остаётся best-effort.
      - name: Upload modal-owner receipts from every attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-owner-receipts-${{ matrix.project }}
          path: |
            test-results/modal-owner-contract-*/modal-owner-diagnostics.json
            test-results/modal-owner-contract-*/a-popup-before-completion.png
            test-results/modal-owner-contract-*/b-over-old-popup-area.png
            test-results/modal-owner-contract-*/b-owned-popup.png
            test-results/modal-owner-contract-*/final-state.png
            test-results/modal-owner-close-lifecycle-*/natural-close-sibling.json
            test-results/modal-owner-close-lifecycle-*/natural-close-sibling.png
            test-results/modal-owner-close-lifecycle-*/natural-close-sibling-observer-final.json
            test-results/modal-owner-close-lifecycle-*/natural-close-nested.json
            test-results/modal-owner-close-lifecycle-*/natural-close-nested.png
            test-results/modal-owner-close-lifecycle-*/natural-close-nested-observer-final.json
            test-results/modal-owner-close-lifecycle-*/held-close-css-contract.json
            test-results/modal-owner-close-lifecycle-*/held-close-css-contract.png
            test-results/modal-owner-close-lifecycle-*/held-close-css-contract-observer-final.json
          retention-days: 7
          if-no-files-found: error

      # Без трасс разбирать падение в CI нечем: локально его может не быть.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.project }}
          path: /tmp/server.log
          retention-days: 7
          if-no-files-found: ignore

  # Сохраняем существующее имя required check: success только когда оба
  # matrix-задания успешны; failure/cancelled/skipped не превращаются в PASS.
  e2e:
    name: e2e
    needs: browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every browser job to succeed
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BROWSER_RESULT" = success
