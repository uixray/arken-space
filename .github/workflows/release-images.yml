name: Temporary bounded snapshot connectivity diagnostic
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Diagnostic label
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe official endpoints from runner
        shell: bash
        run: |
          for host in snapshot.debian.org snapshot-fastly.debian.org snapshot-cloudflare.debian.org; do
            for ip in 4 6; do
              echo "=== $host IPv$ip ==="
              curl -"$ip" --silent --show-error --location --max-time 25 --output /dev/null --write-out 'http=%{http_code} time=%{time_total}\n' "https://$host/archive/debian/20260518T000000Z/dists/bookworm-proposed-updates/InRelease" || true
            done
          done
      - name: Probe apt in pinned base image with bounded timeouts
        shell: bash
        run: |
          image='node:20-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0'
          for mode in default ipv4; do
            echo "=== apt $mode ==="
            timeout 150s docker run --rm -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro -e MODE="$mode" "$image" sh -c '
              printf "%s\n" "deb https://snapshot-fastly.debian.org/archive/debian/20260518T000000Z/ bookworm main" "deb https://snapshot-fastly.debian.org/archive/debian/20260518T000000Z/ bookworm-proposed-updates main" > /tmp/snapshot.list
              force=""; [ "$MODE" != ipv4 ] || force="-o Acquire::ForceIPv4=true"
              apt-get update -o Acquire::Check-Valid-Until=false -o Acquire::https::Timeout=20 -o Acquire::Retries=0 -o APT::Update::Error-Mode=any -o Dir::Etc::sourcelist=/tmp/snapshot.list -o Dir::Etc::sourceparts=- $force
            ' && echo "apt $mode PASS" || echo "apt $mode FAIL exit=$?"
          done
