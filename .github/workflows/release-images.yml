name: Temporary Debian package probe
on:
  workflow_dispatch:
    inputs:
      revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe actual Debian package bytes
        shell: bash
        run: |
          for pkg in 'libu/libusb-1.0/libusb-1.0-0_1.0.26-1_amd64.deb' 'libm/libmfx/libmfx1_22.5.4-1_amd64.deb' 'f/ffmpeg/ffmpeg_5.1.9-0+deb12u1_amd64.deb'; do
            echo "=== $pkg ==="
            for base in 'https://snapshot.debian.org/archive/debian/20260518T000000Z/pool/main' 'https://snapshot-fastly.debian.org/archive/debian/20260518T000000Z/pool/main' 'https://snapshot-cloudflare.debian.org/archive/debian/20260518T000000Z/pool/main' 'https://deb.debian.org/debian/pool/main' 'https://deb.debian.org/debian-security/pool/updates/main'; do
              printf '%s ' "$base"
              curl -4 -L --silent --show-error --max-time 12 -o /tmp/probe.deb -w 'http=%{http_code} size=%{size_download} time=%{time_total}\n' "$base/$pkg" || true
              if dpkg-deb --info /tmp/probe.deb >/dev/null 2>&1; then sha256sum /tmp/probe.deb; fi
            done
          done
