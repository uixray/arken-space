name: Temporary signed snapshot package installation probe
on:
  workflow_dispatch:
    inputs:
      revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned package closure with native apt verification
        shell: bash
        run: |
          timeout 600s docker run --rm -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro -v "$PWD/scripts/debian-snapshot-proxy.cjs:/tmp/proxy.cjs:ro" node:20-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0 sh -ec '
            node /tmp/proxy.cjs & p=$!; trap "kill $p" EXIT
            printf "%s\n" "deb http://127.0.0.1:18765/archive/debian/20260518T000000Z/ bookworm main" "deb http://127.0.0.1:18765/archive/debian/20260518T000000Z/ bookworm-proposed-updates main" > /tmp/snapshot.list
            opts="-o Acquire::Check-Valid-Until=false -o APT::Update::Error-Mode=any -o Dir::Etc::sourcelist=/tmp/snapshot.list -o Dir::Etc::sourceparts=-"
            apt-get update $opts
            apt-get install -y --no-install-recommends $opts libglib2.0-0 libexpat1 libjpeg62-turbo libpng16-16 libwebp7 libwebpmux3 libwebpdemux2 libtiff6 libaom3 libdav1d6 librsvg2-2 libpango-1.0-0 libpangocairo-1.0-0 liblcms2-2 libexif12 libarchive13 libcgif0 libimagequant0 fontconfig "ffmpeg=7:5.1.9-0+deb12u1"
            ffmpeg -version | head -1 | grep -F 5.1.9
            ffprobe -version | head -1 | grep -F 5.1.9
          '
