name: multiplayer

# UIX-523: последний гейт, который держал разработку на локальной машине.
#
# `pnpm test:multiplayer` поднимает собственный Docker Compose со своим
# PostgreSQL, прогоняет историю «мастер и шесть игроков» с обрывом сети и
# перезапуском бэкенда. Локально это занимает пару минут и требует рабочего
# Docker Desktop; `ubuntu-latest` даёт Docker нативно.
#
# Гейт не входит в `e2e.yml` намеренно: он поднимает свой стек, и смешивать их
# в одном job значит удваивать время обоих при падении любого.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: multiplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multiplayer:
    runs-on: ubuntu-latest
    # Локально прогон укладывается в 2 минуты, но раннер ещё собирает образы.
    timeout-minutes: 45

    env:
      # Раннер не должен ходить в production за health-проверкой: гейт обязан
      # быть полностью изолированным.
      ARKEN_ISOLATED_ONLY: "true"
      # Свободного места на раннере заметно меньше, чем требует локальный
      # порог по умолчанию (6 GiB), а образы всё равно собираются здесь же.
      ARKEN_E2E_MIN_FREE_BYTES: "2147483648"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Раннер приходит с образами и кэшами, которые этому гейту не нужны, а
      # места он требует под свои. Без очистки сборка упирается в диск.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h / | tail -1

      # `pnpm test:multiplayer` маскирует настоящий код возврата, если вывод
      # уходит в пайп: процесс завершается нулём, тогда как прогон красный.
      # Здесь пайпа нет намеренно — код возврата берётся как есть.
      - run: pnpm test:multiplayer

      # Отчёт раннера — единственное, по чему видно, была ли изоляция
      # соблюдена и не осталось ли контейнеров после прогона.
      - name: Upload multiplayer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-artifacts
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
